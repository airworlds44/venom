name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/venom-wheel-test
          /tmp/venom-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/venom-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/venom-wheel-test/bin/python -m pip check
          /tmp/venom-wheel-test/bin/venom --help
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
